<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="osuGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff8ec6" />
      <stop offset="60%" stop-color="#ff66aa" />
      <stop offset="100%" stop-color="#d63384" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="46" fill="#12121c" stroke="#ff66aa" stroke-width="4" />
  <!-- Main osu circle -->
  <circle cx="50" cy="50" r="38" fill="url(#osuGrad)" filter="url(#glow)" />
  <!-- Inner White Star / Gacha Icon -->
  <polygon points="50,22 56,38 72,40 60,51 64,68 50,59 36,68 40,51 28,40 44,38" fill="#ffffff" />
  <!-- Inner ring accent -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="8 4" />
</svg>
