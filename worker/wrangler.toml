name = "osu-beatmap-gacha-worker"
main = "src/index.ts"
compatibility_date = "2024-04-01"

# Environment Variables (Non-sensitive)
[vars]
FRONTEND_URL = "https://gacha.vivlos.dev"

# D1 Database Binding
# Replace `database_id` with your Cloudflare D1 Database UUID after running `wrangler d1 create osu-gacha-db`
[[d1_databases]]
binding = "osu_gacha_db"
database_name = "osu-gacha-db"
database_id = "481fe966-833a-44a2-892b-a836d92187df"

# Sensitive Secrets (Configure via `npx wrangler secret put <NAME>`):
# - OSU_CLIENT_ID (e.g. 12345)
# - OSU_CLIENT_SECRET (e.g. your_secret_from_osu_oauth)
